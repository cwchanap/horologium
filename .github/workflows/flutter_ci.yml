name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        flutter-version: ['3.32.5']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}
        channel: 'stable'
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Verify the installation
      run: flutter doctor -v
      
    - name: Analyze project source
      run: flutter analyze --fatal-infos

    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Run tests with coverage
      run: flutter test --coverage

    - name: Regenerate goldens and upload (temporary)
      if: always()
      run: flutter test --update-goldens test/mining/presentation/visual_parity_golden_test.dart

    - name: Upload regenerated goldens (temporary)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: regenerated-goldens
        path: test/mining/presentation/goldens/*.png

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage/lcov.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build APK (Debug)
      run: flutter build apk --debug
      
    - name: Build Web
      run: flutter build web

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.flutter-version }}
        path: |
          build/app/outputs/flutter-apk/app-debug.apk
          build/web/