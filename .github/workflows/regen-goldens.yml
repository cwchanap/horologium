name: Regen goldens

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate mine site goldens
        run: flutter test --update-goldens test/mining/presentation/visual_parity_golden_test.dart

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/mining/presentation/goldens/
